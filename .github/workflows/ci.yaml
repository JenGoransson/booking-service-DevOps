name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
         image: mysql
         env:
           MYSQL_ROOT_PASSWORD: root
           MYSQL_DATABASE: bookingdb

         ports:
          - 3306:3306
         options:
           --health-cmd="mysqladmin ping -h localhost -root -proot"
           --health-interval=10s
           --health-timeout=5s
           --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests
        run: mvn -B test

      - name: Build application
        run: mvn -B package -DskipTests